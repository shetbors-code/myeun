<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PIN Login</title>
     <link
            rel="icon"
            type="image/png"
            href="pink4.jpg - Edited.png"
        >


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style1.css"
    >

</head>


<body>


    <!-- =====================================================
         PORORO MOUSE CURSOR
    ====================================================== -->

    <img
        src="purorort.jpg - Edited.png"
        alt=""
        id="pororoCursor"
        class="pororo-cursor"
    >


    <!-- =====================================================
         GREETING
    ====================================================== -->

    <h2 class="greeting">

        Hey Loveee, Hope you like my little presence for you!

        <!-- PORORO + CLICK ME -->

        <span class="pororo-container">

            <!-- VISUAL HINT ONLY — NOT CLICKABLE -->

            <span class="pororo-hint">
                <span class="hint-sparkle sparkle-one">✦</span>

                <span class="hint-text">
                    click me ♡
                </span>

                <span class="hint-sparkle sparkle-two">♡</span>
            </span>


            <!-- ONLY PORORO IS CLICKABLE -->

            <img
                src="pororo.png"
                alt="Pororo"
                class="pororo-icon"
                onclick="showPororoMessage()"
            >

        </span>

    </h2>


    <br>


    <!-- =====================================================
         PASSCODE BOX
    ====================================================== -->

    <div class="login-box">

        <p class="passcode-text">
            Enter Passcode to Continue
        </p>


        <!-- PIN DISPLAY -->

        <div
            class="pin-display"
            id="pinDisplay"
        >

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- =================================================
             NUMBER KEYPAD
        ================================================== -->

        <div class="keypad">

            <button
                type="button"
                onclick="addNumber('1')"
            >
                1
            </button>

            <button
                type="button"
                onclick="addNumber('2')"
            >
                2
            </button>

            <button
                type="button"
                onclick="addNumber('3')"
            >
                3
            </button>

            <button
                type="button"
                onclick="addNumber('4')"
            >
                4
            </button>

            <button
                type="button"
                onclick="addNumber('5')"
            >
                5
            </button>

            <button
                type="button"
                onclick="addNumber('6')"
            >
                6
            </button>

            <button
                type="button"
                onclick="addNumber('7')"
            >
                7
            </button>

            <button
                type="button"
                onclick="addNumber('8')"
            >
                8
            </button>

            <button
                type="button"
                onclick="addNumber('9')"
            >
                9
            </button>

            <button
                type="button"
                class="clear-btn"
                onclick="clearPin()"
            >
                C
            </button>

            <button
                type="button"
                onclick="addNumber('0')"
            >
                0
            </button>

            <button
                type="button"
                class="backspace-btn"
                onclick="removeNumber()"
            >
                ⌫
            </button>

        </div>


        <!-- ENTER BUTTON -->

        <button
            type="button"
            class="login-btn"
            onclick="login()"
        >
            Enter
        </button>


        <!-- ERROR MESSAGE -->

        <p id="error">
            Incorrect passcode.
        </p>

    </div>


    <!-- =====================================================
         PORORO DIALOGUE
    ====================================================== -->

    <div
        class="pororo-dialogue"
        id="pororoDialogue"
    >

        <div class="dialogue-content">

            <button
                class="close-dialogue"
                onclick="closePororoMessage()"
                type="button"
            >
                ×
            </button>


            <div class="dialogue-heart">
                ♡
            </div>


            <p>
                Hey there my cutiee pieee, type this code number
            </p>


            <p>
                (9426)
            </p>


            <span>
                — from your poging bebe
            </span>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
