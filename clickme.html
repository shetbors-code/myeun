<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For My Love </title>

 <link
            rel="icon"
            type="image/png"
            href="pink4.jpg - Edited.png"
        >
 
    <!-- CLICK ME PAGE CSS -->
    <link
        rel="stylesheet"
        href="clickme.css"
    >

</head>


<body class="love-page clickme-page">


    <!-- =====================================================
         CUSTOM PORORO CURSOR
    ====================================================== -->

    <img
        id="pororoCursor"
        class="pororo-cursor"
        src="purorort.jpg - Edited.png"
        alt=""
    >


    <div
        id="heartCursor"
        class="heart-cursor"
    >

        <span>♥</span>

    </div>


    <div
        id="cursorTracker"
        class="cursor-tracker"
    ></div>


    <!-- =====================================================
         CLICK ME SCENE
    ====================================================== -->

    <section
        class="scene scene-one"
        id="sceneOne"
    >


        <!-- FLOWER EXPLOSION CONTAINER -->

        <div
            id="heartExplosion"
            class="heart-explosion"
        ></div>


        <!-- HEART -->

        <div
            class="heart-container"
            id="heartContainer"
        >

            <button
                class="big-heart"
                id="bigHeart"
                onclick="handleBigHeartClick()"
                aria-label="Open"
                type="button"
            >
                ❤️
            </button>


            <div
                class="click-text"
                id="clickText"
            >
                Click me
            </div>

        </div>

    </section>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="clickme.js"></script>


</body>

</html>
